[package]
name = "belt"
version = "4.4.0"
edition = "2024"
description = "A fast, cross-platform Factorio benchmarking tool"
license = "MIT"
repository = "https://github.com/florishafkenscheid/belt"
homepage = "https://github.com/florishafkenscheid/belt"
keywords = ["factorio", "benchmark", "gaming", "performance"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "belt"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
csv = "1.4.0"
ctrlc = "3.5.3"
directories = "6.0.0"
fastrand = "2.5.0"
flate2 = "1.1.11"
glob = "0.3.4"
handlebars = "6.4.4"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = "0.40.4"
thiserror = "2.0.21"
toml = "1.2.2"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
zstd = "0.14.5"

[dev-dependencies]
tempfile = "3.27.0"
